<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture Vault - Full Stack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
    .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .gradient-text { background: linear-gradient(135deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sidebar-link { transition: all 0.2s; border-left: 3px solid transparent; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.08); border-left-color: #3b82f6; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    .toast-exit { animation: slideOut 0.3s ease-in forwards; }
    .input-error { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239,68,68,0.2) !important; }
    .input-success { border-color: #10b981 !important; box-shadow: 0 0 0 3px rgba(16,185,129,0.2) !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, createContext, useContext } = React;
    const { motion, AnimatePresence } = window.Motion;

    // ==================== DATABASE / API SIMULATION ====================
    // This simulates a real backend with SQLite-like persistence using localStorage
    // In production, replace these with actual fetch() calls to your Node.js/Express API
    
    const DB = {
      // Initialize database
      init() {
        if (!localStorage.getItem('lecture_vault_db')) {
          const initialData = {
            users: [
              { id: 1, name: 'System Admin', username: 'admin', email: 'admin@lecturevault.com', password: 'admin123', role: 'admin', createdAt: '2026-05-01T10:00:00Z' },
            ],
            lectures: [
              { id: 1, name: 'Object Oriented Programming Concepts 1', url: 'https://drive.google.com/drive/folders/168nUiam_sjU3B9C7ihbrt7gW7FpOC5YT?usp=drive_link', createdAt: '2026-05-08T10:00:00Z', createdBy: 1 },
              { id: 2, name: 'Web Development 1', url: 'https://drive.google.com/drive/folders/1qw-v0uA52Tc0QoRJ8Ra4ddIKK-jWXgsh?usp=drive_link', createdAt: '2026-05-08T09:00:00Z', createdBy: 1 },
              { id: 3, name: 'Database Management 1', url: 'https://drive.google.com/drive/folders/1QsVUJDdU8DtabZGhiJvXdgjX0oZqeAp8?usp=drive_link', createdAt: '2026-05-07T14:00:00Z', createdBy: 1 },
              { id: 4, name: 'Mathematics for Computer Science', url: 'https://drive.google.com/drive/folders/1shYhyWLDq-kM_xFQFhsyl9w_4__1mTz4?usp=drive_link', createdAt: '2026-05-07T11:00:00Z', createdBy: 1 },
            ],
            activityLogs: [
              { id: 1, action: 'System initialized', userId: 1, timestamp: '2026-05-08T12:00:00Z', details: 'Database created with default admin' }
            ]
          };
          localStorage.setItem('lecture_vault_db', JSON.stringify(initialData));
        }
        return JSON.parse(localStorage.getItem('lecture_vault_db'));
      },

      getAll() { return this.init(); },
      
      save(data) { localStorage.setItem('lecture_vault_db', JSON.stringify(data)); },
      
      // Users
      getUsers() { return this.getAll().users; },
      getUserById(id) { return this.getUsers().find(u => u.id === id); },
      getUserByUsername(username) { return this.getUsers().find(u => u.username === username); },
      getUserByEmail(email) { return this.getUsers().find(u => u.email === email); },
      
      createUser(userData) {
        const db = this.getAll();
        const newUser = {
          id: Date.now(),
          ...userData,
          role: 'student',
          createdAt: new Date().toISOString()
        };
        db.users.push(newUser);
        this.logActivity('User registered', newUser.id, `New account: ${newUser.username}`);
        this.save(db);
        return newUser;
      },
      
      validateUser(username, password) {
        const user = this.getUserByUsername(username);
        if (!user) return { success: false, error: 'Username not found' };
        if (user.password !== password) return { success: false, error: 'Invalid password' };
        return { success: true, user: { id: user.id, name: user.name, username: user.username, email: user.email, role: user.role } };
      },

      // Lectures
      getLectures() { return this.getAll().lectures; },
      createLecture(lectureData) {
        const db = this.getAll();
        const newLecture = { id: Date.now(), ...lectureData, createdAt: new Date().toISOString() };
        db.lectures.push(newLecture);
        this.logActivity('Lecture created', lectureData.createdBy, `Added: ${newLecture.name}`);
        this.save(db);
        return newLecture;
      },
      updateLecture(id, updates) {
        const db = this.getAll();
        const idx = db.lectures.findIndex(l => l.id === id);
        if (idx === -1) return null;
        db.lectures[idx] = { ...db.lectures[idx], ...updates };
        this.logActivity('Lecture updated', updates.updatedBy || db.lectures[idx].createdBy, `Updated: ${db.lectures[idx].name}`);
        this.save(db);
        return db.lectures[idx];
      },
      deleteLecture(id) {
        const db = this.getAll();
        const lecture = db.lectures.find(l => l.id === id);
        db.lectures = db.lectures.filter(l => l.id !== id);
        this.logActivity('Lecture deleted', 1, `Removed: ${lecture?.name || 'Unknown'}`);
        this.save(db);
        return true;
      },

      // Activity Logs
      logActivity(action, userId, details) {
        const db = this.getAll();
        db.activityLogs.unshift({
          id: Date.now(),
          action,
          userId,
          timestamp: new Date().toISOString(),
          details
        });
        if (db.activityLogs.length > 100) db.activityLogs = db.activityLogs.slice(0, 100);
        this.save(db);
      },
      getActivityLogs() { return this.getAll().activityLogs; },

      // Stats
      getStats() {
        const db = this.getAll();
        return {
          totalUsers: db.users.length,
          totalLectures: db.lectures.length,
          totalStudents: db.users.filter(u => u.role === 'student').length,
          todayLectures: db.lectures.filter(l => l.createdAt.startsWith(new Date().toISOString().split('T')[0])).length,
          recentActivity: db.activityLogs.slice(0, 10)
        };
      }
    };

    // ==================== TOAST SYSTEM ====================
    const ToastContext = createContext();

    const ToastProvider = ({ children }) => {
      const [toasts, setToasts] = useState([]);

      const addToast = useCallback((message, type = 'success', duration = 4000) => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type, duration }]);
        setTimeout(() => removeToast(id), duration);
      }, []);

      const removeToast = useCallback((id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      }, []);

      return (
        <ToastContext.Provider value={{ addToast, removeToast }}>
          {children}
          <div className="fixed top-6 right-6 z-[100] space-y-3 w-80 pointer-events-none">
            <AnimatePresence>
              {toasts.map(toast => (
                <motion.div
                  key={toast.id}
                  initial={{ x: 100, opacity: 0, scale: 0.9 }}
                  animate={{ x: 0, opacity: 1, scale: 1 }}
                  exit={{ x: 100, opacity: 0, scale: 0.9 }}
                  className={`pointer-events-auto p-4 rounded-2xl shadow-2xl backdrop-blur-md border flex items-start gap-3 ${
                    toast.type === 'error' ? 'bg-red-500/95 border-red-400/30' :
                    toast.type === 'warning' ? 'bg-amber-500/95 border-amber-400/30' :
                    toast.type === 'info' ? 'bg-blue-500/95 border-blue-400/30' :
                    'bg-emerald-500/95 border-emerald-400/30'
                  } text-white`}
                >
                  <div className="mt-0.5">
                    <i className={`fas fa-${
                      toast.type === 'error' ? 'exclamation-circle' :
                      toast.type === 'warning' ? 'exclamation-triangle' :
                      toast.type === 'info' ? 'info-circle' :
                      'check-circle'
                    }`}></i>
                  </div>
                  <div className="flex-1">
                    <p className="font-medium text-sm leading-relaxed">{toast.message}</p>
                  </div>
                  <button onClick={() => removeToast(toast.id)} className="opacity-70 hover:opacity-100 transition">
                    <i className="fas fa-times text-xs"></i>
                  </button>
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </ToastContext.Provider>
      );
    };

    const useToast = () => {
      const context = useContext(ToastContext);
      if (!context) throw new Error('useToast must be used within ToastProvider');
      return context;
    };

    // ==================== VALIDATION ====================
    const Validation = {
      name(value) {
        if (!value || value.trim().length < 2) return { valid: false, message: 'Name must be at least 2 characters' };
        if (!/^[a-zA-Z\s]+$/.test(value)) return { valid: false, message: 'Name can only contain letters and spaces' };
        return { valid: true };
      },
      username(value) {
        if (!value || value.trim().length < 3) return { valid: false, message: 'Username must be at least 3 characters' };
        if (!/^[a-zA-Z0-9_]+$/.test(value)) return { valid: false, message: 'Username can only contain letters, numbers, and underscores' };
        if (DB.getUserByUsername(value)) return { valid: false, message: 'Username already taken' };
        return { valid: true };
      },
      email(value) {
        if (!value) return { valid: false, message: 'Email is required' };
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(value)) return { valid: false, message: 'Please enter a valid email address' };
        if (DB.getUserByEmail(value)) return { valid: false, message: 'Email already registered' };
        return { valid: true };
      },
      password(value) {
        if (!value || value.length < 6) return { valid: false, message: 'Password must be at least 6 characters' };
        if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(value)) {
          return { valid: false, message: 'Password must contain uppercase, lowercase, and a number' };
        }
        return { valid: true };
      },
      confirmPassword(password, confirm) {
        if (password !== confirm) return { valid: false, message: 'Passwords do not match' };
        return { valid: true };
      },
      lectureName(value) {
        if (!value || value.trim().length < 3) return { valid: false, message: 'Lecture name must be at least 3 characters' };
        return { valid: true };
      },
      url(value) {
        if (!value) return { valid: false, message: 'URL is required' };
        try {
          new URL(value);
          return { valid: true };
        } catch {
          return { valid: false, message: 'Please enter a valid URL' };
        }
      }
    };

    // ==================== UI COMPONENTS ====================
    const Card = ({ children, className = "" }) => <div className={`rounded-2xl ${className}`}>{children}</div>;
    const Button = ({ children, onClick, className = "", variant = "default", disabled = false, type = "button" }) => {
      const variants = {
        default: "bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/50",
        outline: "border border-white/20 hover:bg-white/10 text-white",
        ghost: "hover:bg-white/10 text-slate-300 hover:text-white",
        danger: "bg-red-600/90 hover:bg-red-500 text-white shadow-lg shadow-red-900/30",
        success: "bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/30",
        secondary: "bg-white/10 hover:bg-white/20 text-white"
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`inline-flex items-center justify-center rounded-xl px-4 py-2.5 text-sm font-medium transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    };

    const Input = ({ type = "text", placeholder, value, onChange, error, success, className = "", icon, ...props }) => (
      <div className="relative">
        {icon && <i className={`fas fa-${icon} absolute left-4 top-1/2 -translate-y-1/2 ${error ? 'text-red-400' : success ? 'text-emerald-400' : 'text-slate-500'}`}></i>}
        <input
          type={type}
          placeholder={placeholder}
          value={value}
          onChange={onChange}
          className={`w-full rounded-xl bg-white/10 border px-4 py-3 text-white placeholder-white/30 outline-none transition-all duration-200 ${
            icon ? 'pl-11' : ''
          } ${
            error ? 'border-red-500 input-error' : 
            success ? 'border-emerald-500 input-success' : 
            'border-white/10 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50'
          } ${className}`}
          {...props}
        />
        {error && <p className="text-red-400 text-xs mt-1.5 ml-1"><i className="fas fa-exclamation-circle mr-1"></i>{error}</p>}
        {success && !error && <p className="text-emerald-400 text-xs mt-1.5 ml-1"><i className="fas fa-check-circle mr-1"></i>Looks good</p>}
      </div>
    );

    const Icon = ({ name, size = 16, className = "" }) => <i className={`fas fa-${name} ${className}`} style={{ fontSize: size }}></i>;

    // ==================== LOGIN & REGISTER ====================
    const AuthScreen = ({ onLogin }) => {
      const [mode, setMode] = useState('login'); // 'login' | 'register'
      const [loading, setLoading] = useState(false);
      const { addToast } = useToast();

      // Login state
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginErrors, setLoginErrors] = useState({});

      // Register state
      const [registerForm, setRegisterForm] = useState({
        name: '', username: '', email: '', password: '', confirmPassword: ''
      });
      const [registerErrors, setRegisterErrors] = useState({});
      const [touched, setTouched] = useState({});

      const validateLogin = () => {
        const errors = {};
        if (!loginForm.username.trim()) errors.username = 'Username is required';
        if (!loginForm.password) errors.password = 'Password is required';
        setLoginErrors(errors);
        return Object.keys(errors).length === 0;
      };

      const validateRegisterField = (field, value) => {
        let result;
        switch(field) {
          case 'name': result = Validation.name(value); break;
          case 'username': result = Validation.username(value); break;
          case 'email': result = Validation.email(value); break;
          case 'password': result = Validation.password(value); break;
          case 'confirmPassword': result = Validation.confirmPassword(registerForm.password, value); break;
          default: return true;
        }
        return result;
      };

      const handleRegisterChange = (field, value) => {
        setRegisterForm(prev => ({ ...prev, [field]: value }));
        setTouched(prev => ({ ...prev, [field]: true }));
        
        const validation = validateRegisterField(field, value);
        setRegisterErrors(prev => ({
          ...prev,
          [field]: validation.valid ? null : validation.message
        }));

        // Re-validate confirm password if password changes
        if (field === 'password' && registerForm.confirmPassword && touched.confirmPassword) {
          const confirmValidation = Validation.confirmPassword(value, registerForm.confirmPassword);
          setRegisterErrors(prev => ({
            ...prev,
            confirmPassword: confirmValidation.valid ? null : confirmValidation.message
          }));
        }
      };

      const validateRegister = () => {
        const errors = {};
        const fields = ['name', 'username', 'email', 'password', 'confirmPassword'];
        fields.forEach(field => {
          const validation = validateRegisterField(field, registerForm[field]);
          if (!validation.valid) errors[field] = validation.message;
        });
        setRegisterErrors(errors);
        setTouched({ name: true, username: true, email: true, password: true, confirmPassword: true });
        return Object.keys(errors).length === 0;
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (!validateLogin()) {
          addToast('Please fix the errors in the form', 'error');
          return;
        }
        setLoading(true);
        setTimeout(() => {
          const result = DB.validateUser(loginForm.username, loginForm.password);
          if (result.success) {
            addToast(`Welcome back, ${result.user.name}!`, 'success');
            onLogin(result.user);
          } else {
            addToast(result.error, 'error');
            setLoginErrors({ general: result.error });
          }
          setLoading(false);
        }, 600);
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (!validateRegister()) {
          addToast('Please fix all validation errors', 'error');
          return;
        }
        setLoading(true);
        setTimeout(() => {
          try {
            const newUser = DB.createUser({
              name: registerForm.name.trim(),
              username: registerForm.username.trim(),
              email: registerForm.email.trim(),
              password: registerForm.password
            });
            addToast('Registration successful! Please log in.', 'success');
            setMode('login');
            setLoginForm({ username: registerForm.username, password: '' });
            setRegisterForm({ name: '', username: '', email: '', password: '', confirmPassword: '' });
            setRegisterErrors({});
            setTouched({});
          } catch (err) {
            addToast('Registration failed. Please try again.', 'error');
          }
          setLoading(false);
        }, 800);
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-950 via-blue-950 to-indigo-900 flex items-center justify-center p-6 relative overflow-hidden">
          <div className="absolute inset-0">
            <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl animate-pulse"></div>
            <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl animate-pulse" style={{ animationDelay: '2s' }}></div>
          </div>

          <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6 }} className="w-full max-w-md relative z-10">
            <Card className="glass rounded-3xl shadow-2xl overflow-hidden">
              {/* Toggle Tabs */}
              <div className="flex border-b border-white/10">
                <button onClick={() => setMode('login')}
                  className={`flex-1 py-4 text-sm font-medium transition-all ${mode === 'login' ? 'text-white border-b-2 border-blue-500 bg-white/5' : 'text-slate-400 hover:text-white'}`}>
                  <Icon name="sign-in-alt" className="mr-2" /> Sign In
                </button>
                <button onClick={() => setMode('register')}
                  className={`flex-1 py-4 text-sm font-medium transition-all ${mode === 'register' ? 'text-white border-b-2 border-blue-500 bg-white/5' : 'text-slate-400 hover:text-white'}`}>
                  <Icon name="user-plus" className="mr-2" /> Register
                </button>
              </div>

              <div className="p-8">
                {mode === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-5">
                    <div className="text-center space-y-2 mb-6">
                      <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-500/20 mb-2">
                        <Icon name="graduation-cap" size={28} className="text-blue-400" />
                      </div>
                      <h1 className="text-2xl font-bold gradient-text">Welcome Back</h1>
                      <p className="text-sm text-slate-400">Sign in to access your lectures</p>
                    </div>

                    <Input icon="user" placeholder="Username" value={loginForm.username}
                      onChange={e => { setLoginForm({...loginForm, username: e.target.value}); setLoginErrors({...loginErrors, username: null, general: null}); }}
                      error={loginErrors.username} />
                    
                    <Input icon="lock" type="password" placeholder="Password" value={loginForm.password}
                      onChange={e => { setLoginForm({...loginForm, password: e.target.value}); setLoginErrors({...loginErrors, password: null, general: null}); }}
                      error={loginErrors.password} />

                    {loginErrors.general && (
                      <div className="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm text-center">
                        <Icon name="exclamation-circle" className="mr-2" />{loginErrors.general}
                      </div>
                    )}

                    <Button type="submit" disabled={loading} className="w-full py-3 text-base rounded-xl">
                      {loading ? <><Icon name="spinner" className="animate-spin mr-2" /> Signing in...</> : <><Icon name="lock" /> <span className="ml-2">Secure Login</span></>}
                    </Button>

                    
                    </div>
                  </form>
                ) : (
                  <form onSubmit={handleRegister} className="space-y-4">
                    <div className="text-center space-y-2 mb-6">
                      <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/20 mb-2">
                        <Icon name="user-plus" size={24} className="text-emerald-400" />
                      </div>
                      <h1 className="text-2xl font-bold gradient-text">Create Account</h1>
                      <p className="text-sm text-slate-400">Join Lecture Vault today</p>
                    </div>

                    <Input icon="id-card" placeholder="Full Name" value={registerForm.name}
                      onChange={e => handleRegisterChange('name', e.target.value)}
                      error={touched.name && registerErrors.name}
                      success={touched.name && !registerErrors.name && registerForm.name.length >= 2} />

                    <Input icon="user" placeholder="Username" value={registerForm.username}
                      onChange={e => handleRegisterChange('username', e.target.value)}
                      error={touched.username && registerErrors.username}
                      success={touched.username && !registerErrors.username && registerForm.username.length >= 3} />

                    <Input icon="envelope" type="email" placeholder="Email Address" value={registerForm.email}
                      onChange={e => handleRegisterChange('email', e.target.value)}
                      error={touched.email && registerErrors.email}
                      success={touched.email && !registerErrors.email && registerForm.email.includes('@')} />

                    <Input icon="lock" type="password" placeholder="Password (min 6 chars, A-Z, a-z, 0-9)" value={registerForm.password}
                      onChange={e => handleRegisterChange('password', e.target.value)}
                      error={touched.password && registerErrors.password}
                      success={touched.password && !registerErrors.password && registerForm.password.length >= 6} />

                    <Input icon="lock" type="password" placeholder="Confirm Password" value={registerForm.confirmPassword}
                      onChange={e => handleRegisterChange('confirmPassword', e.target.value)}
                      error={touched.confirmPassword && registerErrors.confirmPassword}
                      success={touched.confirmPassword && !registerErrors.confirmPassword && registerForm.confirmPassword === registerForm.password && registerForm.confirmPassword !== ''} />

                    <Button type="submit" variant="success" disabled={loading} className="w-full py-3 text-base rounded-xl mt-2">
                      {loading ? <><Icon name="spinner" className="animate-spin mr-2" /> Creating account...</> : <><Icon name="user-check" /> <span className="ml-2">Create Account</span></>}
                    </Button>
                  </form>
                )}
              </div>
            </Card>
          </motion.div>
        </div>
      );
    };

    // ==================== STUDENT PORTAL ====================
    const StudentPortal = ({ user, onLogout }) => {
      const [lectures, setLectures] = useState(DB.getLectures());
      const [searchQuery, setSearchQuery] = useState("");
      const { addToast } = useToast();

      const filteredLectures = lectures.filter(l => l.name.toLowerCase().includes(searchQuery.toLowerCase()));

      const handleOpenLecture = (lecture) => {
        addToast(`Opening ${lecture.name}...`, 'info');
        window.open(lecture.url, '_blank');
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white">
          <header className="border-b border-white/10 bg-slate-950/50 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center">
                  <Icon name="graduation-cap" size={20} className="text-blue-400" />
                </div>
                <div>
                  <h1 className="font-bold text-lg">Lecture Vault</h1>
                  <p className="text-xs text-slate-400">Student Portal</p>
                </div>
              </div>
              <div className="flex items-center gap-4">
                <div className="hidden md:flex items-center gap-2 text-sm text-slate-400">
                  <Icon name="user" size={14} />
                  <span>{user.name}</span>
                  <span className="px-2 py-0.5 rounded-full text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/20">Student</span>
                </div>
                <Button variant="ghost" onClick={() => { addToast('Logged out successfully', 'info'); onLogout(); }} className="rounded-xl">
                  <Icon name="sign-out-alt" /> <span className="ml-2">Logout</span>
                </Button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8 space-y-8">
            <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="text-center space-y-4 py-6">
              <h2 className="text-4xl md:text-5xl font-bold gradient-text">Welcome back, {user.name}</h2>
              <p className="text-slate-400 text-lg max-w-2xl mx-auto">Access your course recordings and study materials.</p>
            </motion.div>

            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.1 }} className="max-w-xl mx-auto">
              <div className="relative">
                <Icon name="search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                <input type="text" placeholder="Search lectures..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  className="w-full rounded-2xl bg-white/5 border border-white/10 pl-12 pr-4 py-4 text-white placeholder-white/30 outline-none focus:ring-2 focus:ring-blue-500/30 transition-all" />
              </div>
            </motion.div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              <AnimatePresence>
                {filteredLectures.map((lecture, i) => (
                  <motion.div key={lecture.id} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, scale: 0.9 }}
                    transition={{ delay: i * 0.05 }} layout>
                    <Card className="glass-card rounded-2xl overflow-hidden group h-full cursor-pointer" onClick={() => handleOpenLecture(lecture)}>
                      <div className="p-6 space-y-4">
                        <div className="w-12 h-12 rounded-xl bg-blue-500/10 flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
                          <Icon name="play-circle" size={24} className="text-blue-400" />
                        </div>
                        <div>
                          <h3 className="font-semibold text-lg leading-snug mb-2 group-hover:text-blue-300 transition-colors">{lecture.name}</h3>
                          <p className="text-sm text-slate-500">Google Drive Folder</p>
                        </div>
                        <Button className="w-full rounded-xl mt-2 pointer-events-none">
                          <Icon name="external-link-alt" size={14} /> <span className="ml-2">Open Recording</span>
                        </Button>
                      </div>
                    </Card>
                  </motion.div>
                ))}
              </AnimatePresence>
            </div>

            {filteredLectures.length === 0 && (
              <div className="text-center py-16 text-slate-500">
                <Icon name="search" size={48} className="mb-4 opacity-30" />
                <p className="text-lg">No lectures found matching "{searchQuery}"</p>
              </div>
            )}

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pt-8 border-t border-white/10">
              {[
                { label: "Total Lectures", value: lectures.length, icon: "folder-open", color: "blue" },
                { label: "Subjects", value: new Set(lectures.map(l => l.name.split(' ')[0])).size, icon: "book", color: "purple" },
                { label: "Storage", value: "Active", icon: "database", color: "emerald" },
                { label: "Your Access", value: "Full", icon: "check-circle", color: "emerald" }
              ].map((stat, i) => (
                <motion.div key={i} initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.3 + i * 0.1 }}
                  className="text-center p-4 rounded-xl bg-white/5 border border-white/5">
                  <Icon name={stat.icon} size={20} className={`text-${stat.color}-400 mb-2`} />
                  <div className="text-2xl font-bold">{stat.value}</div>
                  <div className="text-xs text-slate-500 mt-1">{stat.label}</div>
                </motion.div>
              ))}
            </div>
          </main>
        </div>
      );
    };

    // ==================== ADMIN DASHBOARD ====================
    const AdminDashboard = ({ user, onLogout }) => {
      const [activeTab, setActiveTab] = useState("lectures");
      const [lectures, setLectures] = useState(DB.getLectures());
      const [users, setUsers] = useState(DB.getUsers());
      const [newLecture, setNewLecture] = useState({ name: '', url: '' });
      const [editingId, setEditingId] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [lectureErrors, setLectureErrors] = useState({});
      const { addToast } = useToast();

      const stats = DB.getStats();

      const validateLecture = () => {
        const errors = {};
        const nameValidation = Validation.lectureName(newLecture.name);
        const urlValidation = Validation.url(newLecture.url);
        if (!nameValidation.valid) errors.name = nameValidation.message;
        if (!urlValidation.valid) errors.url = urlValidation.message;
        setLectureErrors(errors);
        return Object.keys(errors).length === 0;
      };

      const addLecture = () => {
        if (!validateLecture()) {
          addToast('Please fix the errors in the form', 'error');
          return;
        }
        const created = DB.createLecture({ ...newLecture, createdBy: user.id });
        setLectures(DB.getLectures());
        setNewLecture({ name: '', url: '' });
        setLectureErrors({});
        addToast(`Lecture "${created.name}" added successfully!`, 'success');
      };

      const removeLecture = (id) => {
        if (!window.confirm('Are you sure you want to delete this lecture?')) return;
        DB.deleteLecture(id);
        setLectures(DB.getLectures());
        addToast('Lecture deleted successfully', 'success');
      };

      const filteredLectures = lectures.filter(l => l.name.toLowerCase().includes(searchQuery.toLowerCase()));

      const sidebarItems = [
        { id: "lectures", icon: "folder-open", label: "Lectures" },
        { id: "users", icon: "users", label: "Users" },
        { id: "analytics", icon: "chart-line", label: "Analytics" },
        { id: "logs", icon: "history", label: "Activity Logs" },
        { id: "settings", icon: "cog", label: "Settings" }
      ];

      const handleLogout = () => {
        addToast('Admin session ended', 'info');
        onLogout();
      };

      return (
        <div className="min-h-screen bg-slate-950 text-white flex">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900/80 border-r border-white/10 flex flex-col fixed h-full z-30">
            <div className="p-6 border-b border-white/10">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center">
                  <Icon name="shield-alt" size={18} className="text-white" />
                </div>
                <div>
                  <h1 className="font-bold">Lecture Vault</h1>
                  <p className="text-xs text-slate-400">Admin Console</p>
                </div>
              </div>
            </div>

            <nav className="flex-1 p-4 space-y-1">
              {sidebarItems.map(item => (
                <button key={item.id} onClick={() => setActiveTab(item.id)}
                  className={`sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === item.id ? 'active text-white bg-white/10' : 'text-slate-400 hover:text-white'}`}>
                  <Icon name={item.icon} size={16} />
                  {item.label}
                </button>
              ))}
            </nav>

            <div className="p-4 border-t border-white/10">
              <div className="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/5 mb-3">
                <div className="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center">
                  <Icon name="user-shield" size={14} className="text-blue-400" />
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium truncate">{user.name}</p>
                  <p className="text-xs text-slate-500">Administrator</p>
                </div>
              </div>
              <Button variant="ghost" onClick={handleLogout} className="w-full justify-center">
                <Icon name="sign-out-alt" size={14} /> <span className="ml-2">Logout</span>
              </Button>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 ml-64 p-8 space-y-6 overflow-y-auto h-screen">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-3xl font-bold capitalize">{activeTab}</h2>
                <p className="text-slate-400 text-sm mt-1">Manage your lecture repository</p>
              </div>
              <div className="glass px-4 py-2 rounded-xl text-sm text-slate-300">
                <Icon name="code" size={14} className="mr-2 text-blue-400" />
                Developer: Harsha
              </div>
            </div>

            {/* Stats */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              {[
                { label: "Total Lectures", value: stats.totalLectures, icon: "folder-open", color: "from-blue-600/20 to-blue-400/10" },
                { label: "Total Users", value: stats.totalUsers, icon: "users", color: "from-purple-600/20 to-purple-400/10" },
                { label: "Students", value: stats.totalStudents, icon: "user-graduate", color: "from-emerald-600/20 to-emerald-400/10" },
                { label: "Added Today", value: stats.todayLectures, icon: "plus-circle", color: "from-amber-600/20 to-amber-400/10" }
              ].map((stat, i) => (
                <motion.div key={i} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i * 0.1 }}>
                  <Card className={`bg-gradient-to-br ${stat.color} border-white/10 rounded-2xl`}>
                    <div className="p-5">
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-slate-400 text-sm">{stat.label}</span>
                        <Icon name={stat.icon} size={18} className="text-white/60" />
                      </div>
                      <div className="text-3xl font-bold">{stat.value}</div>
                    </div>
                  </Card>
                </motion.div>
              ))}
            </div>

            <AnimatePresence mode="wait">
              {/* LECTURES TAB */}
              {activeTab === "lectures" && (
                <motion.div key="lectures" initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="space-y-6">
                  <Card className="glass border-white/10 rounded-2xl">
                    <div className="p-6">
                      <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                        <Icon name="plus" size={16} className="text-blue-400" />
                        Add New Lecture
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                          <Input placeholder="Lecture name" value={newLecture.name}
                            onChange={e => { setNewLecture({...newLecture, name: e.target.value}); setLectureErrors({...lectureErrors, name: null}); }}
                            error={lectureErrors.name} />
                        </div>
                        <div>
                          <Input placeholder="Google Drive folder URL" value={newLecture.url}
                            onChange={e => { setNewLecture({...newLecture, url: e.target.value}); setLectureErrors({...lectureErrors, url: null}); }}
                            error={lectureErrors.url} />
                        </div>
                        <Button onClick={addLecture} className="rounded-xl self-start">
                          <Icon name="plus-circle" size={16} /> <span className="ml-2">Add Lecture</span>
                        </Button>
                      </div>
                    </div>
                  </Card>

                  <div className="flex items-center gap-4">
                    <div className="relative flex-1 max-w-md">
                      <Icon name="search" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" />
                      <input type="text" placeholder="Search lectures..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                        className="w-full rounded-xl bg-white/5 border border-white/10 pl-11 pr-4 py-3 text-white placeholder-white/30 outline-none focus:ring-2 focus:ring-blue-500/30" />
                    </div>
                    <div className="text-sm text-slate-500">{filteredLectures.length} lectures</div>
                  </div>

                  <div className="space-y-3">
                    <AnimatePresence>
                      {filteredLectures.map((lecture, i) => (
                        <motion.div key={lecture.id} initial={{ opacity: 0, x: -20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: 20 }}
                          transition={{ delay: i * 0.03 }} layout>
                          <Card className="glass-card rounded-xl group">
                            <div className="p-4 flex items-center gap-4">
                              <div className="w-10 h-10 rounded-lg bg-blue-500/10 flex items-center justify-center shrink-0">
                                <Icon name="video" size={16} className="text-blue-400" />
                              </div>
                              {editingId === lecture.id ? (
                                <div className="flex-1 flex gap-3">
                                  <input type="text" defaultValue={lecture.name} id={`edit-name-${lecture.id}`}
                                    className="flex-1 rounded-lg bg-white/10 border border-white/20 px-3 py-2 text-sm text-white" />
                                  <Button variant="success" onClick={() => {
                                    const newName = document.getElementById(`edit-name-${lecture.id}`).value;
                                    DB.updateLecture(lecture.id, { name: newName, updatedBy: user.id });
                                    setLectures(DB.getLectures());
                                    setEditingId(null);
                                    addToast('Lecture updated', 'success');
                                  }} className="px-3">
                                    <Icon name="check" size={14} />
                                  </Button>
                                  <Button variant="ghost" onClick={() => setEditingId(null)} className="px-3">
                                    <Icon name="times" size={14} />
                                  </Button>
                                </div>
                              ) : (
                                <>
                                  <div className="flex-1 min-w-0">
                                    <h4 className="font-medium truncate">{lecture.name}</h4>
                                    <p className="text-xs text-slate-500 mt-0.5">{lecture.url.substring(0, 50)}...</p>
                                  </div>
                                  <div className="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <Button variant="ghost" onClick={() => window.open(lecture.url, '_blank')} className="px-3 py-2">
                                      <Icon name="external-link-alt" size={14} />
                                    </Button>
                                    <Button variant="ghost" onClick={() => setEditingId(lecture.id)} className="px-3 py-2">
                                      <Icon name="edit" size={14} />
                                    </Button>
                                    <Button variant="danger" onClick={() => removeLecture(lecture.id)} className="px-3 py-2">
                                      <Icon name="trash-alt" size={14} />
                                    </Button>
                                  </div>
                                </>
                              )}
                            </div>
                          </Card>
                        </motion.div>
                      ))}
                    </AnimatePresence>
                  </div>
                </motion.div>
              )}

              {/* USERS TAB */}
              {activeTab === "users" && (
                <motion.div key="users" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="space-y-6">
                  <Card className="glass border-white/10 rounded-2xl overflow-hidden">
                    <div className="p-6 border-b border-white/10">
                      <h3 className="text-lg font-semibold">Registered Users</h3>
                      <p className="text-sm text-slate-400 mt-1">Manage user accounts and permissions</p>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full">
                        <thead className="bg-white/5">
                          <tr>
                            <th className="text-left text-xs font-medium text-slate-400 uppercase px-6 py-3">User</th>
                            <th className="text-left text-xs font-medium text-slate-400 uppercase px-6 py-3">Username</th>
                            <th className="text-left text-xs font-medium text-slate-400 uppercase px-6 py-3">Email</th>
                            <th className="text-left text-xs font-medium text-slate-400 uppercase px-6 py-3">Role</th>
                            <th className="text-left text-xs font-medium text-slate-400 uppercase px-6 py-3">Joined</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-white/5">
                          {users.map(u => (
                            <tr key={u.id} className="hover:bg-white/5 transition">
                              <td className="px-6 py-4">
                                <div className="flex items-center gap-3">
                                  <div className="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center">
                                    <Icon name="user" size={12} className="text-blue-400" />
                                  </div>
                                  <span className="font-medium">{u.name}</span>
                                </div>
                              </td>
                              <td className="px-6 py-4 text-sm text-slate-300">{u.username}</td>
                              <td className="px-6 py-4 text-sm text-slate-300">{u.email}</td>
                              <td className="px-6 py-4">
                                <span className={`px-2 py-1 rounded-full text-xs border ${
                                  u.role === 'admin' ? 'bg-blue-500/20 text-blue-300 border-blue-500/20' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/20'
                                }`}>
                                  {u.role}
                                </span>
                              </td>
                              <td className="px-6 py-4 text-sm text-slate-500">{new Date(u.createdAt).toLocaleDateString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </Card>
                </motion.div>
              )}

              {/* ANALYTICS TAB */}
              {activeTab === "analytics" && (
                <motion.div key="analytics" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="space-y-6">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <Card className="glass border-white/10 rounded-2xl p-8 text-center">
                      <Icon name="chart-pie" size={48} className="text-slate-600 mb-4" />
                      <h3 className="text-xl font-semibold mb-2">Usage Analytics</h3>
                      <p className="text-slate-400">Track lecture access patterns and popular content.</p>
                    </Card>
                    <Card className="glass border-white/10 rounded-2xl p-8 text-center">
                      <Icon name="chart-bar" size={48} className="text-slate-600 mb-4" />
                      <h3 className="text-xl font-semibold mb-2">Growth Metrics</h3>
                      <p className="text-slate-400">Monitor user registration and content growth over time.</p>
                    </Card>
                  </div>
                </motion.div>
              )}

              {/* LOGS TAB */}
              {activeTab === "logs" && (
                <motion.div key="logs" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="space-y-6">
                  <Card className="glass border-white/10 rounded-2xl overflow-hidden">
                    <div className="p-6 border-b border-white/10">
                      <h3 className="text-lg font-semibold">Activity Logs</h3>
                      <p className="text-sm text-slate-400 mt-1">Recent system activity and changes</p>
                    </div>
                    <div className="divide-y divide-white/5">
                      {stats.recentActivity.map((log, i) => (
                        <div key={log.id} className="p-4 flex items-center gap-4 hover:bg-white/5 transition">
                          <div className="w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center shrink-0">
                            <Icon name="history" size={12} className="text-blue-400" />
                          </div>
                          <div className="flex-1">
                            <p className="text-sm font-medium">{log.action}</p>
                            <p className="text-xs text-slate-500">{log.details}</p>
                          </div>
                          <div className="text-xs text-slate-600">
                            {new Date(log.timestamp).toLocaleTimeString()}
                          </div>
                        </div>
                      ))}
                    </div>
                  </Card>
                </motion.div>
              )}

              {/* SETTINGS TAB */}
              {activeTab === "settings" && (
                <motion.div key="settings" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="space-y-6">
                  <Card className="glass border-white/10 rounded-2xl p-8">
                    <h3 className="text-xl font-semibold mb-6">System Settings</h3>
                    <div className="space-y-4 max-w-lg">
                      <div className="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                        <div>
                          <p className="font-medium">Database Integration</p>
                          <p className="text-sm text-slate-400">Connect to Firebase/Supabase backend</p>
                        </div>
                        <div className="w-12 h-6 rounded-full bg-blue-600 relative cursor-pointer">
                          <div className="absolute right-1 top-1 w-4 h-4 rounded-full bg-white"></div>
                        </div>
                      </div>
                      <div className="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                        <div>
                          <p className="font-medium">Public Access</p>
                          <p className="text-sm text-slate-400">Allow guest viewing without login</p>
                        </div>
                        <div className="w-12 h-6 rounded-full bg-slate-700 relative cursor-pointer">
                          <div className="absolute left-1 top-1 w-4 h-4 rounded-full bg-white"></div>
                        </div>
                      </div>
                      <div className="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                        <div>
                          <p className="font-medium">Email Notifications</p>
                          <p className="text-sm text-slate-400">Send alerts on new lectures</p>
                        </div>
                        <div className="w-12 h-6 rounded-full bg-slate-700 relative cursor-pointer">
                          <div className="absolute left-1 top-1 w-4 h-4 rounded-full bg-white"></div>
                        </div>
                      </div>
                    </div>
                  </Card>
                </motion.div>
              )}
            </AnimatePresence>
          </main>
        </div>
      );
    };

    // ==================== MAIN APP ====================
    function App() {
      const [user, setUser] = useState(null);

      return (
        <ToastProvider>
          {!user ? (
            <AuthScreen onLogin={setUser} />
          ) : user.role === 'admin' ? (
            <AdminDashboard user={user} onLogout={() => setUser(null)} />
          ) : (
            <StudentPortal user={user} onLogout={() => setUser(null)} />
          )}
        </ToastProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
